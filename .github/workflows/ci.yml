name: CI

# Runs the standard's own gates against the worked example in example/.
#
# This is the demonstration as much as the check: the same four gates a client
# project gets, running for real on every pull request. A red check here means
# the standard caught something, which is the point.
#
# It only blocks a merge because `main` is protected and `verify` is marked a
# required status check — the workflow alone would just report.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: example

# Least privilege. Without this block a workflow inherits whatever the
# repository default is, which on many repos is write access to everything —
# and a compromised action in the tree then has it too.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: example/package-lock.json

      # `npm ci` installs exactly what the lockfile says, so CI tests the same
      # tree production builds.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # config → images → content → links → next build. Any non-zero exit stops
      # the chain.
      - name: Build
        run: npm run build

      # Proves the gates REJECT. The build above only proves they accept, and a
      # check that quietly stopped catching things would still be green.
      - name: Gate tests
        run: npm run test:gates

      # A gate, not a notice. `|| true` here would mean a repository with
      # "standard" in its name shipping known high-severity advisories in
      # production dependencies while its own CI stayed green — the exact
      # contradiction this project exists to avoid.
      #
      # Scoped to production dependencies and to high/critical: a moderate
      # advisory in a build-time dev tool is not reachable from the running
      # site, and failing on it would train people to ignore the step.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
