name: CI

# The gate that actually stops a broken site from shipping.
#
# Important: this workflow only *reports*. GitHub does not block a merge on a
# failing check unless the branch is protected and this job is marked required.
# Without that setting the whole thing is decoration — see
# references/quality-gates.md for the two settings to switch on.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes the previous run on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without this block a workflow inherits whatever the
# repository default is, which on many repos is write access to everything —
# and a compromised action in the tree then has it too.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly what the lockfile says. `npm install` can
      # silently pick up newer versions, which means CI stops testing the same
      # thing production builds.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs the content gate, the link check, and next build — the same chain
      # as local, so "works on my machine" and "passes CI" cannot diverge.
      - name: Build
        run: npm run build

      # Proves the gates REJECT. The build above only proves they accept, and a
      # check that quietly stopped catching things would still be green.
      - name: Gate tests
        run: npm run test:gates

      # A gate, not a notice. `|| true` here would mean a repository with
      # "standard" in its name shipping known high-severity advisories in
      # production dependencies while its own CI stayed green — the exact
      # contradiction this project exists to avoid.
      #
      # Scoped to production dependencies and to high/critical: a moderate
      # advisory in a build-time dev tool is not reachable from the running
      # site, and failing on it would train people to ignore the step.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
